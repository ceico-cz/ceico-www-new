<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>CEICO website editor (admin)</title>
  <link rel="icon" href="/assets/brand/logos/ceico-icon-compact.svg" type="image/svg+xml">
  <link href="/admin/full/config.yml" type="application/yaml" rel="cms-config-url">
</head>
<body>
  <!-- Sveltia CMS, served from this site (see eleventy.config.js). -->
  <script src="/admin/sveltia/sveltia-cms.js"></script>
  <script>
    // Name the sign-in button after FZU GitLab and explain where it works.
    // Sveltia has no option for this, so the label is replaced once rendered.
    new MutationObserver(() => {
      for (const button of document.querySelectorAll("button")) {
        // Sveltia wraps "GitLab" in invisible bidi isolation marks (U+2068/9).
        const text = button.textContent.replace(/[\u2066-\u2069]/g, "").trim();
        if (button.dataset.fzu || text !== "Sign In with GitLab") continue;
        button.dataset.fzu = "1";
        const walker = document.createTreeWalker(button, NodeFilter.SHOW_TEXT);
        while (walker.nextNode()) {
          const node = walker.currentNode;
          if (node.data.includes("GitLab")) node.data = node.data.replace("GitLab", "FZU GitLab");
        }
        const note = document.createElement("p");
        note.textContent = "Works from Institute of Physics networks only.";
        note.style.cssText = "margin: 8px 0 0; font-size: 0.875rem; text-align: center; opacity: 0.8;";
        button.after(note);
      }
    }).observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
